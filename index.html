<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Restaurant Digital Menu</title>
  <meta name="description" content="View our restaurant menu.">
  <meta property="og:title" content="Restaurant Digital Menu">
  <meta property="og:description" content="View our restaurant menu.">
  <meta property="og:type" content="website">
  <!-- Replace these two URLs after publishing. -->
  <meta property="og:image" content="https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/menu/3.png">
  <meta property="og:url" content="https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="site-header">
      <div>
        <p class="eyebrow">DIGITAL MENU</p>
        <h1>Restaurant Menu</h1>
      </div>
      <p class="page-count" id="pageCount">13 pages</p>
    </header>

    <section class="gallery" id="gallery" aria-label="Menu pages"></section>
    <p class="load-error" id="loadError" hidden>
      ไม่สามารถโหลดรูปเมนูบางหน้าได้ กรุณาตรวจสอบไฟล์ในโฟลเดอร์ <code>menu</code>
    </p>
  </main>

  <div class="viewer" id="viewer" aria-hidden="true">
    <div class="viewer-topbar">
      <button class="icon-btn" id="closeBtn" type="button" aria-label="ปิด">×</button>
      <div class="viewer-title" id="viewerTitle">Menu 3</div>
      <div class="viewer-counter" id="viewerCounter">1 / 13</div>
    </div>

    <div class="viewer-stage" id="viewerStage">
      <img id="viewerImage" alt="Menu page" draggable="false">
      <div class="viewer-message" id="viewerMessage" hidden></div>
    </div>

    <div class="controls" aria-label="Menu controls">
      <button class="control-btn" id="prevBtn" type="button" aria-label="หน้าก่อนหน้า">‹</button>
      <button class="control-btn" id="zoomOutBtn" type="button" aria-label="ลดขนาด">−</button>
      <button class="control-btn reset" id="resetBtn" type="button" aria-label="รีเซ็ตการซูม">Reset</button>
      <button class="control-btn" id="zoomInBtn" type="button" aria-label="ขยาย">+</button>
      <button class="control-btn" id="nextBtn" type="button" aria-label="หน้าถัดไป">›</button>
    </div>

    <div class="hint">
      <span class="desktop-hint">Scroll = Zoom · Drag = Pan · ← → = เปลี่ยนหน้า · Esc = ปิด</span>
      <span class="mobile-hint">Pinch / Double tap = Zoom · ปัดซ้าย/ขวา = เปลี่ยนหน้า</span>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
